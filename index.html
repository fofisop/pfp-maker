<!DOCTYPE html>
<html lang="en">
    <style>
        .view{
              position: relative;
    width: 300px;
    height: 300px;
    margin: auto;

        }
        .view img {
            position: absolute;
    width: 100%;
    height: 100%;
           object-fit: contain;
    top: 0;
    left: 0;
.layer{
    position: absolute;
     width: 100%;
    height: 100%;

    background-color: transparent;
     mask-size: contain;
    mask-position: center;
    mask-repeat: no-repeat;

     -webkit-mask-size: contain;
    -webkit-mask-position: center;
    -webkit-mask-repeat: no-repeat;
}





        }
        
    </style>
</head>
